<!doctype html>
<html lang="en" data-base="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Masjid Adam Islamic Centre · Mississauga</title>
  <meta name="description" content="Masjid Adam Islamic Centre, 1759 Bloor Street East, Mississauga. Daily prayer times, Jumu’ah, Qur’an classes, announcements and how to support the masjid.">
  <meta name="theme-color" content="#12233F">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="home">
  <header class="site-header" id="siteHeader"></header>

  <section class="hero on-dark">
    <div class="wrap">
      <div class="hero-text" id="heroText"></div>
      <div class="today" id="todayCard" aria-live="polite"></div>
    </div>
  </section>

  <section class="about">
    <div class="wrap">
      <div class="arch reveal"><img src="assets/img/mihrab.jpg" alt="The mihrab and minbar inside Masjid Adam’s prayer hall"></div>
      <div class="reveal" id="aboutText"></div>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap">
      <div class="section-head reveal">
        <p class="kicker">Programs</p>
        <h2>Prayer and learning</h2>
      </div>
      <div class="grid grid-3 reveal" id="programsGrid"></div>
      <p style="margin-top:22px"><a class="btn btn-outline" href="programs.html">All programs →</a></p>
    </div>
  </section>

  <section class="reminder" id="reminder"></section>

  <section>
    <div class="wrap">
      <div class="section-head reveal">
        <p class="kicker">Announcements</p>
        <h2>What’s happening</h2>
      </div>
      <div class="news reveal" id="newsGrid"></div>
      <p style="margin-top:22px"><a class="btn btn-outline" href="announcements.html">All announcements →</a></p>
    </div>
  </section>

  <section class="donate-band on-dark" id="donateBand"></section>

  <section class="visit" id="visit"></section>

  <footer class="site-footer" id="siteFooter"></footer>
  <script src="assets/js/prayer-calc.js"></script>
  <script src="assets/js/defaults.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
