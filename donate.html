<!doctype html>
<html lang="en" data-base="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Donate · {{name}}</title>
  <meta name="description" content="Support Masjid Adam Islamic Centre by Interac e-Transfer, cash or cheque. Your donations cover monthly expenses and Qur’an education.">
  <meta name="theme-color" content="#12233F">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="donate">
  <header class="site-header" id="siteHeader"></header>
  <section class="page-hero">
    <div class="wrap">
      <div class="arabic arabic-title">الصدقة الجارية</div>
      <p class="kicker gold">Support the masjid</p>
      <h1>Give to Masjid Adam</h1>
      <p class="lead"></p>
    </div>
  </section>

  <section>
    <div class="wrap donate-grid">
      <div>
        <div id="donateIntro"></div>
        <div id="methods"></div>
        <div id="giving" style="margin-top:20px"></div>
      </div>
      <aside>
        <p class="kicker">Where it goes</p>
        <div class="uses" id="uses"></div>
        <div class="quote-card" id="quote"></div>
      </aside>
    </div>
  </section>

  <footer class="site-footer" id="siteFooter"></footer>
  <script src="assets/js/prayer-calc.js"></script>
  <script src="assets/js/defaults.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/site.js"></script>

</html>
